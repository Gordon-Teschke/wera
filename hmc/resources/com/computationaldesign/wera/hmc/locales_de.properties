text.product.bulletpoints_marketingtext=Bullet Points und Marketingtext k\u00f6nnen wahlweise an Variante oder Produktfamilie verwaltet werden.<br>Aussagen, die f\u00fcr die Mehrheit der Varianten der Produktfamilie gelten, sollten bei der Produktfamilie verortet werden.<br>Aussagen, die Ausnahmen behandeln, sollten abweichend bei der Variante eingestellt werden.<br>In diesem Fall muss die entsprechende Checkbox ("vorrangig") gesetzt werden, um dem Datenfeld der Variante Priorit\u00e4t zu geben.
